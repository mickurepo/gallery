<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>
<style>
/* ═══════════ RESET ═══════════ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    background:#434343;
    color:#fff;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
}

/* ═══════════ WELCOME SCREEN ═══════════ */
#message{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    min-height:100vh;
    text-align:center;
    padding:40px 20px;
    background:#2a2a30;
    position:relative;
    overflow:hidden;
}
.glow{
    position:absolute;
    width:500px;height:500px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(79,195,247,.08) 0%,transparent 70%);
    animation:pulseGlow 4s ease-in-out infinite;
    pointer-events:none;
}
.glow:nth-child(2){
    width:350px;height:350px;
    animation-delay:-2s;
    background:radial-gradient(circle,rgba(160,120,255,.06) 0%,transparent 70%);
}
@keyframes pulseGlow{
    0%,100%{transform:scale(.8);opacity:.3}
    50%{transform:scale(1.6);opacity:1}
}
#message h2{
    font-size:2.5em;
    margin-bottom:24px;
    position:relative;z-index:1;
    animation:fadeUp .8s ease both;
}
#message p{
    color:#888;
    font-size:1.05em;
    margin-bottom:14px;
    position:relative;z-index:1;
    animation:fadeUp .8s ease both;
    animation-delay:.15s;
}
#message code{
    display:inline-block;
    background:#16162a;
    padding:14px 24px;
    border-radius:10px;
    color:#4fc3f7;
    font-size:.92em;
    word-break:break-all;
    position:relative;z-index:1;
    animation:fadeUp .8s ease both;
    animation-delay:.3s;
    border:1px solid rgba(79,195,247,.15);
}
@keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

/* ═══════════ GALLERY COLUMNS ═══════════ */
#gallery{
    display:flex;
    width:100%;
    min-height:100vh;
}
.column{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}
.column+.column{
    border-left:1px solid rgba(255,255,255,.04);
}
.column-header{
    text-align:center;
    padding:16px 10px;
    font-size:.82em;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2.5px;
    background:rgba(0,0,0,.22);
    border-bottom:2px solid rgba(255,255,255,.04);
    position:sticky;
    top:0;z-index:10;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:rgba(255,255,255,.7);
}

/* ── Image wrapper ── */
.col-img-wrap{
    margin:8px 10px;
    overflow:hidden;
    /*border-radius:8px;*/
    box-shadow:
        0 2px 8px rgba(0,0,0,.25),
        0 4px 20px rgba(0,0,0,.15);
    transition:box-shadow .35s ease,transform .35s cubic-bezier(.25,.46,.45,.94);
    cursor:pointer;
    position:relative;
}
.col-img-wrap:hover{
    box-shadow:
        0 8px 30px rgba(0,0,0,.45),
        0 14px 50px rgba(0,0,0,.25);
    transform:scale(1.025);
    z-index:5;
}
.col-img-wrap img{
    width:100%;
    display:block;
    transition:transform .4s cubic-bezier(.25,.46,.45,.94);
    opacity:0;
}
.col-img-wrap img.loaded{
    opacity:1;
    transition:
        opacity .5s ease,
        transform .4s cubic-bezier(.25,.46,.45,.94);
}
.col-img-wrap:hover img{
    transform:scale(1.07);
}

/* ── Status / spinner ── */
.status{
    text-align:center;
    padding:50px 15px;
    font-size:.88em;
    color:rgba(255,255,255,.25);
}
.status.error{color:#e74c3c}
.spinner{
    margin:60px auto;
    width:30px;height:30px;
    border:3px solid rgba(255,255,255,.08);
    border-top-color:#4fc3f7;
    border-radius:50%;
    animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════ LIGHTBOX ═══════════ */
#lightbox{
    position:fixed;inset:0;
    z-index:1000;
    display:none;
    flex-direction:column;
    background:rgba(10,10,14,.97);
    backdrop-filter:blur(40px);
    -webkit-backdrop-filter:blur(40px);
}
#lightbox.open{display:flex}

.lb-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    flex-shrink:0;
    border-bottom:1px solid rgba(255,255,255,.05);
}
.lb-folder{
    font-size:.85em;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2.5px;
    color:rgba(255,255,255,.45);
}
.lb-close{
    background:none;border:none;
    color:rgba(255,255,255,.4);
    font-size:2.2em;
    cursor:pointer;
    padding:0 6px;
    line-height:1;
    transition:color .2s,transform .2s;
    border-radius:4px;
}
.lb-close:hover{color:#fff;transform:scale(1.15)}

.lb-body{
    flex:1;
    display:flex;
    align-items:stretch;
    overflow:hidden;
    position:relative;
}
.lb-nav{
    width:64px;
    flex-shrink:0;
    background:none;border:none;
    color:rgba(255,255,255,.25);
    font-size:2.8em;
    cursor:pointer;
    transition:color .2s,background .2s;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    -webkit-user-select:none;
}
.lb-nav:hover{
    color:rgba(255,255,255,.7);
    background:rgba(255,255,255,.03);
}
.lb-nav.disabled{
    opacity:.08;
    cursor:default;
    pointer-events:none;
}
.lb-stage{
    flex:1;
    position:relative;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}
.lb-img{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:contain;
    will-change:transform,opacity;
    pointer-events:none;
    opacity:0;
}
.lb-loader{
    position:absolute;inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2;
}
.lb-loader.show{display:flex}
.lb-loader .spinner{
    margin:0;
    width:28px;height:28px;
    border-width:2px;
}

.lb-footer{
    flex-shrink:0;
    padding:10px 22px 18px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.05);
}
.lb-counter{
    font-size:.88em;
    color:rgba(255,255,255,.4);
    margin-bottom:4px;
    overflow:hidden;
    height:1.4em;
    font-variant-numeric:tabular-nums;
}
.lb-counter-inner{
    display:inline-block;
    transition:transform 80ms ease,opacity 80ms ease;
}
.lb-desc{
    font-size:.84em;
    color:rgba(255,255,255,.35);
    max-width:650px;
    margin:0 auto;
    line-height:1.6;
    transition:opacity 150ms ease;
    min-height:1.4em;
}

/* ═══════════ MOBILE ═══════════ */
@media(max-width:700px){
    .lb-nav{width:44px;font-size:2em}
    .lb-header{padding:10px 14px}
    .lb-footer{padding:8px 14px 14px}
    .column-header{padding:12px 6px;font-size:.72em;letter-spacing:1.5px}
    .col-img-wrap{margin:5px 6px}
    #message h2{font-size:1.8em}
}
@media(max-width:400px){
    .lb-nav{width:32px;font-size:1.6em}
}
</style>
</head>
<body>

<!-- ═══════════ WELCOME SCREEN ═══════════ -->
<div id="message"></div>

<!-- ═══════════ GALLERY ═══════════ -->
<div id="gallery"></div>

<!-- ═══════════ LIGHTBOX ═══════════ -->
<div id="lightbox">
    <div class="lb-header">
        <span class="lb-folder"></span>
        <button class="lb-close" onclick="closeLightbox()" title="Zamknij (Esc)">&times;</button>
    </div>
    <div class="lb-body">
        <button class="lb-nav lb-nav-prev" onclick="navigateLB(-1)">&#8249;</button>
        <div class="lb-stage" id="lb-stage">
            <img class="lb-img lb-img-a" alt="">
            <img class="lb-img lb-img-b" alt="">
            <div class="lb-loader"><div class="spinner"></div></div>
        </div>
        <button class="lb-nav lb-nav-next" onclick="navigateLB(1)">&#8250;</button>
    </div>
    <div class="lb-footer">
        <div class="lb-counter"><span class="lb-counter-inner"></span></div>
        <div class="lb-desc"></div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//    K O N F I G U R A C J A   —   ZMIEŃ TUTAJ ↓↓↓
// ════════════════════════════════════════════════════════════
const CONFIG = {

    // ── TRYB ──────────────────────────────────
    //  'github'  →  pobiera listę plików z GitHub API
    //  'local'   →  pobiera z lokalnego serwera
    //                (python3 -m http.server 8000)
    mode: 'github',   // ← ZMIEŃ NA 'local' DO TESTÓW

    // ── GITHUB (tylko gdy mode = 'github') ────
    githubUser : 'mickurepo',   // ← twój login
    githubRepo : 'gallery',      // ← nazwa repo
    branch     : 'dev',           // ← branch

    // ── LOCAL (tylko gdy mode = 'local') ──────
    //  ścieżka do katalogu z folderami
    //  '.'  = ten sam katalog co index.html
    localBase  : '.',

    // ── WSPÓLNE ───────────────────────────────
    //  prefix jeśli foldery NIE są w rootcie repo
    //  np. 'images'  →  repo/images/folder1/...
    //  ''  →  repo/folder1/...
    basePath   : 'images',
};
//
//  ⚠ GitHub API: 60 req/h bez tokena.
//    Przy wielu testach możesz trafić na limit.
//    W trybie 'local' limitu nie ma.
//
// ════════════════════════════════════════════════════════════

const IMG_EXT = new Set([
    'jpg','jpeg','png','gif','webp','bmp','svg','avif','tiff','ico'
]);
const SLIDE_MS = 140;          // ← szybkość animacji slide (ms)
const SWIPE_THRESHOLD = 0.12;  // % szerokości stage = min. swipe

// ── Gallery data ──
let galleryData = [];  // [ {folder, images:[{src,name,desc}]} ]

// ── Lightbox state ──
const LB = {
    open: false,
    colIdx: -1,
    imgIdx: -1,
    animating: false,
    // DOM (filled on init)
    el:null, imgA:null, imgB:null,
    activeImg:null, inactiveImg:null,
    loader:null, counterInner:null,
    descEl:null, folderEl:null,
    prevBtn:null, nextBtn:null, stage:null,
    // Drag
    dragging:false, dragStartX:0, dragDelta:0, dragPid:null,
};

// ════════════════════════════════════════
//              INIT
// ════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
    LB.el           = document.getElementById('lightbox');
    LB.imgA         = LB.el.querySelector('.lb-img-a');
    LB.imgB         = LB.el.querySelector('.lb-img-b');
    LB.activeImg    = LB.imgA;
    LB.inactiveImg  = LB.imgB;
    LB.loader       = LB.el.querySelector('.lb-loader');
    LB.counterInner = LB.el.querySelector('.lb-counter-inner');
    LB.descEl       = LB.el.querySelector('.lb-desc');
    LB.folderEl     = LB.el.querySelector('.lb-folder');
    LB.prevBtn      = LB.el.querySelector('.lb-nav-prev');
    LB.nextBtn      = LB.el.querySelector('.lb-nav-next');
    LB.stage        = document.getElementById('lb-stage');

    setupDrag();
    document.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', render);
    render();
});

// ════════════════════════════════════════
//           URL → FOLDERS
// ════════════════════════════════════════
function getFolders(){
    const h = location.hash.slice(1);
    if(!h) return [];
    return h.split(',').map(f=>decodeURIComponent(f.trim())).filter(Boolean);
}

// ════════════════════════════════════════
//           FETCH IMAGE LIST
// ════════════════════════════════════════
async function fetchImages(folder){
    return CONFIG.mode==='local' ? fetchLocal(folder) : fetchGH(folder);
}

async function fetchGH(folder){
    const p = CONFIG.basePath ? `${CONFIG.basePath}/${folder}` : folder;
    const encoded = p.split('/').map(encodeURIComponent).join('/');
    const url = `https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${encoded}?ref=${CONFIG.branch}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error(`Folder „${folder}" — ${r.status}`);
    const files = await r.json();
    if(!Array.isArray(files)) throw new Error(`„${folder}" nie jest folderem`);
    return files
        .filter(f=>f.type==='file'&&IMG_EXT.has(f.name.split('.').pop().toLowerCase()))
        .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
        .map(f=>({name:f.name, src:f.download_url}));
}

async function fetchLocal(folder){
    const base = `${CONFIG.localBase}/${folder}`;
    const r = await fetch(`${base}/_files.json`);
    if(!r.ok) throw new Error(`Brak ${folder}/_files.json`);
    const files = await r.json();
    return files
        .filter(f=>IMG_EXT.has(f.split('.').pop().toLowerCase()))
        .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
        .map(f=>({name:f, src:`${base}/${f}`}));
}

async function fetchDescs(folder){
    try{
        let url;
        if(CONFIG.mode==='local'){
            url = `${CONFIG.localBase}/${folder}/descriptions.json`;
        } else {
            const p = CONFIG.basePath ? `${CONFIG.basePath}/${folder}` : folder;
            url = `https://raw.githubusercontent.com/${CONFIG.githubUser}/${CONFIG.githubRepo}/${CONFIG.branch}/${p}/descriptions.json`;
        }
        const r = await fetch(url);
        if(!r.ok) return {};
        return await r.json();
    } catch{ return {}; }
}

// ════════════════════════════════════════
//           RENDER GALLERY
// ════════════════════════════════════════
async function render(){
    const folders = getFolders();
    const msgEl   = document.getElementById('message');
    const galEl   = document.getElementById('gallery');

    galEl.innerHTML = '';
    galleryData = [];

    // ── welcome screen ──
    if(!folders.length){
        msgEl.style.display = '';
        msgEl.innerHTML = `
            <div class="glow"></div>
            <div class="glow"></div>
            <h2>📷 Galeria</h2>
            <p>Podaj foldery po <strong>#</strong> w adresie URL:</p>
            <code>${location.origin+location.pathname}#folder1,folder2,folder3</code>
            <p style="margin-top:32px;font-size:.8em;color:#555">
                Foldery oddzielaj przecinkami
            </p>`;
        return;
    }
    msgEl.style.display = 'none';

    // ── create columns ──
    const cols = folders.map(folder => {
        const col = document.createElement('div');
        col.className = 'column';
        const hdr = document.createElement('div');
        hdr.className = 'column-header';
        hdr.textContent = folder;
        col.appendChild(hdr);
        const sp = document.createElement('div');
        sp.className = 'spinner';
        col.appendChild(sp);
        galEl.appendChild(col);
        return {col, spinner:sp};
    });

    // ── fetch all parallel ──
    const results = await Promise.all(folders.map(async folder => {
        try {
            const [imgs, descs] = await Promise.all([
                fetchImages(folder), fetchDescs(folder)
            ]);
            imgs.forEach(i => i.desc = descs[i.name] || '');
            return {images:imgs, error:null};
        } catch(e){
            return {images:[], error:e.message};
        }
    }));

    // ── fill columns ──
    results.forEach(({images,error}, ci) => {
        const {col, spinner} = cols[ci];
        spinner.remove();
        galleryData[ci] = {folder:folders[ci], images};

        if(error){
            const s = document.createElement('div');
            s.className = 'status error';
            s.textContent = error;
            col.appendChild(s);
            return;
        }
        if(!images.length){
            const s = document.createElement('div');
            s.className = 'status';
            s.textContent = 'Brak obrazków';
            col.appendChild(s);
            return;
        }

        images.forEach((imgData, ii) => {
            const wrap = document.createElement('div');
            wrap.className = 'col-img-wrap';
            wrap.addEventListener('click', () => openLightbox(ci, ii));

            const img = document.createElement('img');
            img.src = imgData.src;
            img.alt = imgData.name;
            img.loading = 'lazy';
            img.onload = () => img.classList.add('loaded');
            wrap.appendChild(img);
            col.appendChild(wrap);
        });
    });
}

// ════════════════════════════════════════
//           LIGHTBOX — OPEN / CLOSE
// ════════════════════════════════════════
function openLightbox(ci, ii){
    LB.colIdx = ci;
    LB.imgIdx = ii;
    LB.open = true;
    LB.animating = false;

    const d = galleryData[ci];
    LB.folderEl.textContent = d.folder;

    // reset images
    resetImgSlots();
    LB.activeImg = LB.imgA;
    LB.inactiveImg = LB.imgB;

    showCurrent();
    LB.el.classList.add('open');
    document.body.style.overflow = 'hidden';
    preload();
}

function closeLightbox(){
    LB.open = false;
    LB.el.classList.remove('open');
    document.body.style.overflow = '';
    resetImgSlots();
}

function resetImgSlots(){
    [LB.imgA, LB.imgB].forEach(i => {
        i.style.cssText = '';
        i.src = '';
        i.style.opacity = '0';
    });
    LB.loader.classList.remove('show');
}

// ════════════════════════════════════════
//           LIGHTBOX — DISPLAY
// ════════════════════════════════════════
function showCurrent(){
    const d = galleryData[LB.colIdx];
    const img = d.images[LB.imgIdx];

    LB.loader.classList.add('show');

    LB.activeImg.onload = () => LB.loader.classList.remove('show');
    LB.activeImg.style.transition = 'none';
    LB.activeImg.style.transform  = 'translateX(0)';
    LB.activeImg.style.opacity    = '1';
    LB.activeImg.src = img.src;

    LB.inactiveImg.style.opacity = '0';

    setCounter(LB.imgIdx+1, d.images.length, true);
    setDesc(img.desc, true);
    updateNav();
}

function updateNav(){
    const d = galleryData[LB.colIdx];
    LB.prevBtn.classList.toggle('disabled', LB.imgIdx <= 0);
    LB.nextBtn.classList.toggle('disabled', LB.imgIdx >= d.images.length-1);
}

// ════════════════════════════════════════
//        LIGHTBOX — NAVIGATE (SLIDE)
// ════════════════════════════════════════
function navigateLB(dir){
    if(LB.animating) return;
    const d = galleryData[LB.colIdx];
    const ni = LB.imgIdx + dir;
    if(ni < 0 || ni >= d.images.length) return;

    LB.animating = true;
    const nImg = d.images[ni];

    const outgoing = LB.activeImg;
    const incoming = LB.inactiveImg;

    // ── INCOMING: natychmiast na środku, pod spodem ──
    incoming.src              = nImg.src;
    incoming.style.transition = 'none';
    incoming.style.transform  = 'translateX(0)';
    incoming.style.opacity    = '1';
    incoming.style.zIndex     = '1';

    // ── OUTGOING: zjeżdża w bok (na wierzchu) ──
    outgoing.style.zIndex     = '2';
    const ease = `${SLIDE_MS}ms cubic-bezier(.22,.61,.36,1)`;
    outgoing.style.transition = `transform ${ease}, opacity ${SLIDE_MS}ms ease`;
    outgoing.style.transform  = `translateX(${-dir * 100}%)`;
    outgoing.style.opacity    = '0';

    LB.imgIdx = ni;
    animateCounter(ni+1, d.images.length);
    animateDesc(nImg.desc);
    updateNav();

    setTimeout(() => {
        LB.activeImg   = incoming;
        LB.inactiveImg = outgoing;
        outgoing.style.transition = 'none';
        outgoing.style.opacity    = '0';
        outgoing.style.transform  = '';
        outgoing.style.zIndex     = '';
        incoming.style.zIndex     = '';
        delete outgoing.dataset.peekSrc;
        LB.animating = false;
        preloadAdjacent();
    }, SLIDE_MS);
}

// ════════════════════════════════════════
//        COUNTER ANIMATION
// ════════════════════════════════════════
function setCounter(num, total, instant){
    const el = LB.counterInner;
    el.textContent = `${num} / ${total}`;
    if(instant){
        el.style.transition = 'none';
        el.style.transform  = 'translateY(0)';
        el.style.opacity    = '1';
    }
}

function animateCounter(num, total){
    const el = LB.counterInner;
    const half = SLIDE_MS / 2;

    // slide out up
    el.style.transition = `transform ${half}ms ease, opacity ${half}ms ease`;
    el.style.transform  = 'translateY(-110%)';
    el.style.opacity    = '0';

    setTimeout(() => {
        el.textContent = `${num} / ${total}`;
        el.style.transition = 'none';
        el.style.transform  = 'translateY(110%)';
        el.style.opacity    = '0';

        requestAnimationFrame(() => {
            el.style.transition = `transform ${half}ms ease, opacity ${half}ms ease`;
            el.style.transform  = 'translateY(0)';
            el.style.opacity    = '1';
        });
    }, half);
}

// ════════════════════════════════════════
//        DESCRIPTION ANIMATION
// ════════════════════════════════════════
function setDesc(text, instant){
    LB.descEl.textContent = text || '';
    LB.descEl.style.opacity = text ? '1' : '0';
    if(instant) LB.descEl.style.transition = 'none';
    else        LB.descEl.style.transition = 'opacity 150ms ease';
}

function animateDesc(text){
    LB.descEl.style.transition = 'opacity 100ms ease';
    LB.descEl.style.opacity = '0';
    setTimeout(() => {
        LB.descEl.textContent = text || '';
        LB.descEl.style.opacity = text ? '1' : '0';
    }, 110);
}

// ════════════════════════════════════════
//        PRELOAD ADJACENT
// ════════════════════════════════════════
function preload(){
    const d = galleryData[LB.colIdx];
    [-1, 1, 2].forEach(off => {
        const i = LB.imgIdx + off;
        if(i >= 0 && i < d.images.length){
            const p = new Image();
            p.src = d.images[i].src;
        }
    });
}

// ════════════════════════════════════════
//        DRAG / SWIPE
// ════════════════════════════════════════
function setupDrag(){
    const stage = LB.stage;

    stage.addEventListener('pointerdown', e => {
        if(LB.animating || !LB.open) return;
        LB.dragging   = true;
        LB.dragStartX = e.clientX;
        LB.dragDelta  = 0;
        LB.dragPid    = e.pointerId;
        stage.setPointerCapture(e.pointerId);
        LB.activeImg.style.transition = 'none';
    });

    stage.addEventListener('pointermove', e => {
        if(!LB.dragging || e.pointerId !== LB.dragPid) return;
        let delta = e.clientX - LB.dragStartX;

        // edge resistance
        const d = galleryData[LB.colIdx];
        if((LB.imgIdx <= 0 && delta > 0) ||
           (LB.imgIdx >= d.images.length-1 && delta < 0)){
            delta *= 0.15;
        }
        LB.dragDelta = delta;
        LB.activeImg.style.transform = `translateX(${delta}px)`;

        // peek next / prev
        const dir = delta < 0 ? 1 : -1;
        const pi  = LB.imgIdx + dir;
        if(pi >= 0 && pi < d.images.length){
            const inc = LB.inactiveImg;
            if(inc.dataset.peekSrc !== d.images[pi].src){
                inc.src = d.images[pi].src;
                inc.dataset.peekSrc = d.images[pi].src;
            }
            inc.style.transition = 'none';
            inc.style.opacity    = '1';
            inc.style.transform  = `translateX(${dir * stage.offsetWidth + delta}px)`;
        }
    });

    stage.addEventListener('pointerup', e => {
        if(!LB.dragging || e.pointerId !== LB.dragPid) return;
        LB.dragging = false;

        const sw = stage.offsetWidth;
        const absDelta = Math.abs(LB.dragDelta);

        // tap → close
        if(absDelta < 4){
            closeLightbox();
            return;
        }

        const d = galleryData[LB.colIdx];

        // threshold crossed → complete swipe
        if(absDelta > sw * SWIPE_THRESHOLD){
            const dir = LB.dragDelta < 0 ? 1 : -1;
            const ni  = LB.imgIdx + dir;
            if(ni >= 0 && ni < d.images.length){
                completeSwipe(dir, ni, d);
                return;
            }
        }

        // snap back
        snapBack();
    });

    stage.addEventListener('pointercancel', () => {
        if(LB.dragging){ LB.dragging = false; snapBack(); }
    });
}

function completeSwipe(dir, ni, d){
    LB.animating = true;
    const sw = LB.stage.offsetWidth;

    // ── INCOMING: teleport na środek ──
    LB.inactiveImg.style.transition = 'none';
    LB.inactiveImg.style.transform  = 'translateX(0)';
    LB.inactiveImg.style.opacity    = '1';
    LB.inactiveImg.style.zIndex     = '1';

    // ── OUTGOING: dokańcza zjazd ──
    LB.activeImg.style.zIndex       = '2';
    const ease = `${SLIDE_MS}ms cubic-bezier(.22,.61,.36,1)`;
    LB.activeImg.style.transition   = `transform ${ease}, opacity ${SLIDE_MS}ms ease`;
    LB.activeImg.style.transform    = `translateX(${-dir * sw}px)`;
    LB.activeImg.style.opacity      = '0';

    LB.imgIdx = ni;
    animateCounter(ni+1, d.images.length);
    animateDesc(d.images[ni].desc);
    updateNav();

    setTimeout(() => {
        const tmp = LB.activeImg;
        LB.activeImg   = LB.inactiveImg;
        LB.inactiveImg = tmp;

        tmp.style.transition = 'none';
        tmp.style.opacity    = '0';
        tmp.style.transform  = '';
        tmp.style.zIndex     = '';
        LB.activeImg.style.zIndex = '';
        delete tmp.dataset.peekSrc;

        LB.animating = false;
        preloadAdjacent();
    }, SLIDE_MS);
}

function snapBack(){
    const ease = `${SLIDE_MS}ms ease`;
    LB.activeImg.style.transition   = `transform ${ease}`;
    LB.activeImg.style.transform    = 'translateX(0)';
    LB.inactiveImg.style.transition = `opacity ${ease}`;
    LB.inactiveImg.style.opacity    = '0';
}

// ════════════════════════════════════════
//        KEYBOARD
// ════════════════════════════════════════
function onKey(e){
    if(!LB.open) return;
    switch(e.key){
        case 'ArrowLeft':  e.preventDefault(); navigateLB(-1); break;
        case 'ArrowRight': e.preventDefault(); navigateLB(1);  break;
        case 'Escape':     closeLightbox(); break;
    }
}
</script>
