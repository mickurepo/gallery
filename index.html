<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria z Filmami</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(67, 67, 67);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }



        /* ---------- GALERIA ---------- */
        #gallery {
            display: flex;
            width: 100%;
            padding: 15px;
            gap: 15px;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 20px;
        }

        .column-header {
            text-align: center;
            padding: 14px 8px;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(30, 30, 30, 0.6);
            /*border-radius: 8px;*/
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .img-wrapper {
            position: relative;
            /* Wymagane dla pozycjonowania SVG */
            background: rgb(85, 85, 85);
            /*padding: 8px;*/
            /*border-radius: 12px;*/
            box-shadow: 3px 0px 10px 0px rgba(40, 40, 40, 0.8);
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.3s ease, transform 0.3s ease;

        }

        .img-wrapper img,
        .img-wrapper video {
            width: 100%;
            display: block;
            /*border-radius: 6px;*/
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .img-wrapper img.loaded,
        .img-wrapper video.loaded {
            opacity: 1;
        }

        .img-wrapper:hover {
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
        }

        .img-wrapper:hover img,
        .img-wrapper:hover video {
            transform: scale(1.06);
        }

        /* Ikonka Play dla filmów w kolumnach */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            pointer-events: none;
            /* Kliknięcie przechodzi przez ikonę do wrappera */
            opacity: 0.6;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .img-wrapper:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.15);
            opacity: 1;
        }

        /* ---------- LIGHTBOX ---------- */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 15, 0.94);
            z-index: 1000;
            flex-direction: column;
        }

        #lightbox.open {
            display: flex;
        }

        .lb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 1.2em;
            z-index: 60;
        }

        .lb-folder {
            font-weight: bold;
            color: #4fc3f7;
        }

        .lb-counter {
            font-family: monospace;
            font-size: 1.2em;
            background: #333;
            padding: 5px 12px;
            /*border-radius: 20px;*/
        }

        .lb-close {
            cursor: pointer;
            font-size: 2em;
            line-height: 1;
            color: #bbb;
            z-index: 60;
        }

        .lb-close:hover {
            color: #fff;
        }

        .lb-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 2em;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            z-index: 50;
        }

        .lb-nav:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lb-nav.prev {
            left: 20px;
        }

        .lb-nav.next {
            right: 20px;
        }

        /* ---------- NOWA LOGIKA WARSTW W LIGHTBOXIE ---------- */

        #lb-center-wrapper {
            position: relative;
            z-index: 40;
            /* ZAWSZE NA WIERZCHU */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lb-media {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .lb-clone {
            position: absolute;
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.5s ease;
            z-index: 20;
            /* NOWE: Duchy są w 70% przezroczyste podczas ruchu */
            opacity: 0.2;
        }

        .lb-footer {
            min-height: 80px;
            padding: 20px;
            text-align: center;
            font-size: 1.1em;
            background: rgba(0, 0, 0, 0.5);
            color: #ddd;
            z-index: 60;
        }

        .lb-desc-loading {
            color: #888;
            font-style: italic;
            font-size: 0.9em;

            video::-webkit-media-controls-panel {
                display: flex !important;
                opacity: 1 !important;
                visibility: visible !important;
            }
        }

        .spinner {
            margin: 10px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #444;
            border-top-color: #FFF;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            /*            top: 70vh;
            left: 67vw;
            position: absolute;*/

        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #spinnerAndProgressbar {
            top: 70vh;
            left: 67vw;
            position: absolute;
            width: 100px;
        }






        /* ---------- EKRAN POWITALNY ---------- */
        #message {
            position: fixed;
            /* Kluczowa zmiana: przypina do okna (viewport) */
            inset: 0;
            /* Rozciąga do krawędzi: top, right, bottom, left = 0 */
            background: rgb(0, 0, 0);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            z-index: 1000;
            /* Bardzo wysoki z-index, by na pewno był nad galerią */
            transition: opacity 2s ease, visibility 2s;
            /* Dodajemy visibility dla pewności */
        }

        .pulse-text {
            font-size: 2.4em;
            margin-bottom: 20px;
            color: #fff;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
                transform: scale(1);
            }

            50% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
                transform: scale(1.02);
            }

            100% {
                text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
                transform: scale(1);
            }
        }

        #local-picker-container {
            display: none;
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            /*border-radius: 12px;*/
            border: 1px dashed #777;
        }


        /* Kontener wyrównujący loader na środku */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            color: #555;
        }

        /* Styl samego spinnera */
        .loader {
            border: 8px solid #000000;
            /* Jasne tło kręgu */
            border-top: 8px solid #ABAB77;
            /* Kolor elementu kręcącego się */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
            position: absolute;
            left: 30vw;
            top: 85vh;
        }


        /* Animacja obrotu */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }



        #load-progress-container {
            width: 80%;
            max-width: 400px;
            margin: 20px auto 0;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            height: 24px;
        }

        #load-progress-bar {
            height: 100%;
            width: 0%;
            /* background: linear-gradient(90deg, #116b2c, #8ee4dd, #b3b3b3); */
            background: linear-gradient(90deg, #1e3436, #5f8b7d, #b1b393);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
            transition: width 0.3s ease;
        }

        #load-progress-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        video::-webkit-media-controls-enclosure {
            display: flex !important;
        }

        video::-webkit-media-controls-panel {
            display: flex !important;
            opacity: 1 !important;
        }

        #remastered {
            top: 94vh;
            left: 94vw;
            position: absolute;
            font-size: 1rem;
            color: #cacaac;
            font-style: italic;
            font-family: initial;
        }
    </style>
</head>

async function openLightbox(b,c){currentColumnIndex=b;currentImageIndex=c;lbEl.classList.add("open");updateLightboxUI("none")}function closeLightbox(){lbEl.classList.remove("open");lbCenterWrapper.firstElementChild&&"VIDEO"===lbCenterWrapper.firstElementChild.tagName&&lbCenterWrapper.firstElementChild.pause();lbCenterWrapper.innerHTML="";document.querySelectorAll(".lb-clone").forEach(b=>b.remove())}
function changeImage(b){const c=galleryData[currentColumnIndex];if(0!==c.images.length){var d=currentImageIndex+b;0>d&&(d=c.images.length-1);d>=c.images.length&&(d=0);currentImageIndex=d;updateLightboxUI(0<b?"right":"left")}};


        async function updateLightboxUI(direction) {
            const colData = galleryData[currentColumnIndex];
            const mediaData = colData.images[currentImageIndex];

            lbFolder.textContent = colData.folder;
            lbCounter.textContent = `${currentImageIndex + 1} / ${colData.images.length}`;

            const oldMedia = lbCenterWrapper.firstElementChild;

            if (direction !== 'none' && oldMedia) {
                document.querySelectorAll('.lb-clone').forEach(el => el.remove());

                const oldClone = oldMedia.cloneNode(true);
                oldClone.className = 'lb-clone';
                if (oldClone.tagName === 'VIDEO') {
                    oldMedia.pause(); // Stop dźwięku w oryginale
                    oldClone.muted = true;
                    oldClone.removeAttribute('controls');
                }
                lbBody.appendChild(oldClone);

                const newMedia = createMediaElement(mediaData.src, mediaData.isVideo);
                lbCenterWrapper.innerHTML = '';
                lbCenterWrapper.appendChild(newMedia); // Jest już na miejscu gotowe do oglądania

                const newClone = newMedia.cloneNode(true);
                newClone.className = 'lb-clone';
                if (newClone.tagName === 'VIDEO') {
                    newClone.muted = true;
                    newClone.removeAttribute('controls');
                }

                if (direction === 'right') {
                    newClone.style.transform = 'translateX(100vw) scale(0.6)';
                } else {
                    newClone.style.transform = 'translateX(-100vw) scale(0.6)';
                }
                lbBody.appendChild(newClone);

                void lbBody.offsetWidth;

                if (direction === 'right') {
                    oldClone.style.transform = 'translateX(-100vw) scale(0.6)';
                } else {
                    oldClone.style.transform = 'translateX(100vw) scale(0.6)';
                }
                oldClone.style.opacity = '0';

                newClone.style.transform = 'translateX(0) scale(1)';

                setTimeout(() => {
                    if (oldClone.parentNode) oldClone.remove();
                    if (newClone.parentNode) newClone.remove();
                }, 1000);

            } else {
                lbCenterWrapper.innerHTML = '';
                lbCenterWrapper.appendChild(createMediaElement(mediaData.src, mediaData.isVideo));
            }

            // --- Pobieranie opisów plików ---
            const currentReqId = ++descLoadId;
            lbDesc.innerHTML = '';

            if (mediaData.txtUrl) {
                if (descCache[mediaData.txtUrl]) {
                    lbDesc.innerHTML = descCache[mediaData.txtUrl];
                } else {
                    lbDesc.innerHTML = '<span class="lb-desc-loading">...</span>';
                    try {
                        const response = await fetch(mediaData.txtUrl);
                        const text = await response.text();

                        if (currentReqId !== descLoadId) return;

                        const formattedText = text.replace(/\n/g, '<br>');
                        descCache[mediaData.txtUrl] = formattedText;
                        lbDesc.innerHTML = formattedText;
                    } catch (e) {
                        if (currentReqId === descLoadId) {
                        }
                    }
                }
            } else {
                lbDesc.innerHTML = '';
            }
        }

        // Obsługa dotykowa dla telefonów
        let touchStartX = 0;
        lbBody.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        lbBody.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) changeImage(1);
            if (touchEndX - touchStartX > 40) changeImage(-1);
        });

        document.addEventListener('keydown', e => {
            if (!lbEl.classList.contains('open')) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Escape') { e.preventDefault(); }
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
        });

        window.addEventListener('hashchange', render);
        render();


    </script>
</body>

</html>
